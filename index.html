<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MADA T-F | Premium Edition</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #ff6600; /* Orange Manintona */
            --primary-glow: rgba(255, 102, 0, 0.4);
            --bg-dark: #000814; /* Manga maizina be */
            --bg-gradient: linear-gradient(135deg, #000814 0%, #001d3d 100%);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body { 
            margin: 0; font-family: 'Poppins', 'Segoe UI', sans-serif; 
            background: var(--bg-dark);
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: #fff;
            overflow-x: hidden;
        }

        /* HEADER */
        .header {
            background: rgba(0, 8, 20, 0.85);
            backdrop-filter: blur(20px);
            padding: 15px 20px;
            position: sticky;
            top: 0; z-index: 2000;
            display: flex; flex-direction: column; gap: 15px;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .header h1 { margin: 0; font-size: 1.5rem; font-weight: 900; letter-spacing: 1px; }
        .header h1 span { 
            color: var(--primary); 
            text-shadow: 0 0 20px var(--primary-glow); 
        }

        /* SEARCH BAR */
        .search-container { position: relative; width: 100%; }
        .search-bar {
            width: 100%; padding: 14px 50px 14px 25px;
            border-radius: 30px; border: 1px solid var(--glass-border);
            background: var(--glass);
            color: white; font-size: 0.95rem; outline: none;
            box-sizing: border-box; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .search-bar:focus { 
            border-color: var(--primary); 
            background: rgba(255, 102, 0, 0.05);
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .search-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: var(--primary); }

        .menu-btn {
            background: var(--primary);
            border: none; color: white; padding: 10px 20px; border-radius: 30px;
            font-weight: 700; font-size: 0.8rem; cursor: pointer;
            box-shadow: 0 5px 15px var(--primary-glow);
            transition: 0.3s;
        }
        .menu-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--primary-glow); }

        /* MENU DROPDOWN */
        .dropdown {
            display: none; position: fixed; top: 120px; right: 15px;
            background: #001d3d;
            border: 1px solid var(--primary); border-radius: 15px; z-index: 3000;
            flex-direction: column; width: 180px; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .dropdown button {
            background: none; border: none; color: white; padding: 15px 20px;
            text-align: left; font-weight: 600; cursor: pointer;
            border-bottom: 1px solid var(--glass-border); transition: 0.3s;
        }
        .dropdown button:hover { background: var(--primary); color: white; }

        /* FEED & POSTS */
        .feed { padding: 20px; max-width: 600px; margin: 0 auto; }

        .post {
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 35px; border-radius: 30px;
            border: 1px solid var(--glass-border);
            overflow: hidden; position: relative;
            transition: 0.4s;
        }
        .post:hover { 
            transform: translateY(-10px); 
            border-color: var(--primary);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .img-container { position: relative; width: 100%; aspect-ratio: 16/14; overflow: hidden; }
        .post-img { width: 100%; height: 100%; object-fit: cover; transition: 1.2s; }
        .post:hover .post-img { transform: scale(1.1); }

        .post-info { padding: 25px; background: linear-gradient(to bottom, transparent, rgba(0,8,20,0.95)); }
        .price { 
            font-size: 2rem; font-weight: 900; color: var(--primary); margin: 0;
            letter-spacing: -1px;
        }
        .title { font-size: 1.3rem; font-weight: 700; margin: 10px 0; color: #fff; }
        .desc { color: #a3b1c6; font-size: 0.9rem; line-height: 1.6; margin-bottom: 25px; }

        .actions { display: flex; gap: 12px; }
        .btn {
            flex: 1; padding: 16px; border-radius: 18px;
            text-decoration: none; text-align: center;
            font-weight: 800; font-size: 0.85rem; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-wa { background: #25D366; color: white; }
        .btn-call { background: #fff; color: #000; }
        .btn:hover { opacity: 0.9; transform: scale(1.02); }

        /* FAB */
        .fab {
            position: fixed; bottom: 30px; right: 30px;
            width: 65px; height: 65px; background: var(--primary);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px var(--primary-glow); z-index: 1000;
            color: white; transition: 0.3s;
        }
        .fab:hover { transform: rotate(15deg) scale(1.1); }

        /* LOADING ANIMATION */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .post { animation: fadeIn 0.6s ease backwards; }
    </style>
</head>
<body onload="start()">

<div class="header">
    <div class="header-top">
        <h1 onclick="location.reload()">MADA <span>T-F</span></h1>
        <button class="menu-btn" onclick="toggleMenu()"><i class="fas fa-bars"></i> HIDITRA</button>
    </div>
    
    <div class="search-container">
        <input type="text" class="search-bar" id="searchInput" placeholder="Tadiavo eto ny nofinofinao..." oninput="searchProduct()">
        <i class="fas fa-search search-icon"></i>
    </div>
</div>

<div class="dropdown" id="categoryMenu">
    <button onclick="filterCat('all')"><i class="fas fa-th-large"></i> REHETRA</button>
    <button onclick="filterCat('fiara')"><i class="fas fa-car"></i> FIARA</button>
    <button onclick="filterCat('trano')"><i class="fas fa-home"></i> TRANO</button>
    <button onclick="filterCat('tany')"><i class="fas fa-map-marked-alt"></i> TANY</button>
</div>

<div class="feed" id="mainFeed">
    </div>

<a href="https://wa.me/261340000000" class="fab">
    <i class="fab fa-whatsapp" style="font-size: 32px;"></i>
</a>

<script src="data.js"></script>

<script>
    function start() {
        if (typeof db !== 'undefined') {
            show(db);
        } else {
            const demo = [{
                sary: "https://via.placeholder.com/600x400", 
                vidy: "Error", 
                anarana: "Tsy hita ny data.js", 
                details: "Hamarino tsara raha ao ilay rakitra data.js", 
                karazana: "all", 
                tel: "0"
            }];
            show(demo);
        }
    }

    function show(data) {
        const feed = document.getElementById('mainFeed');
        if(!data || data.length === 0) {
            feed.innerHTML = `<div style="text-align:center; padding:100px 20px; color:#666;">
                <i class="fas fa-search" style="font-size:3rem; margin-bottom:20px; display:block;"></i>
                Tsy misy vokatray mifanaraka amin'izany...
            </div>`;
            return;
        }
        
        feed.innerHTML = data.map((item, index) => `
            <div class="post" style="animation-delay: ${index * 0.1}s">
                <div class="img-container">
                    <img src="${item.sary}" class="post-img" alt="${item.anarana}" loading="lazy">
                </div>
                <div class="post-info">
                    <p class="price">${item.vidy}</p>
                    <div class="title">${item.anarana}</div>
                    <div class="desc">${item.details}</div>
                    <div class="actions">
                        <a href="https://wa.me/${item.tel}" class="btn btn-wa"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                        <a href="tel:${item.tel}" class="btn btn-call"><i class="fas fa-phone"></i> Antsoy</a>
                    </div>
                </div>
            </div>
        `).reverse().join('');
    }

    function searchProduct() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        if (typeof db !== 'undefined') {
            const filtered = db.filter(item => 
                item.anarana.toLowerCase().includes(term) || 
                item.details.toLowerCase().includes(term) ||
                item.vidy.toLowerCase().includes(term)
            );
            show(filtered);
        }
    }

    function toggleMenu() {
        const m = document.getElementById('categoryMenu');
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
    }

    function filterCat(c) {
        toggleMenu();
        if (typeof db !== 'undefined') {
            const f = (c === 'all') ? db : db.filter(i => i.karazana === c);
            show(f);
        }
    }

    window.onclick = function(event) {
        if (!event.target.matches('.menu-btn') && !event.target.closest('.menu-btn')) {
            const dropdown = document.getElementById('categoryMenu');
            if (dropdown) dropdown.style.display = 'none';
        }
    }
</script>

</body>
</html>
