<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MADA T-F | Ultimate</title>
    <style>
        :root {
            --red: #ff0000;
            --dark: #050505;
            --glass: rgba(255, 255, 255, 0.1);
        }

        /* 1. ANIMATION BACKGROUND MASIAKA */
        body { 
            margin: 0; font-family: 'Arial', sans-serif; 
            background: #000;
            background: linear-gradient(-45deg, #050505, #2a0000, #000, #4a0000);
            background-size: 400% 400%;
            animation: fireMove 10s ease infinite;
            color: #fff;
            overflow-x: hidden;
        }
        @keyframes fireMove { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        /* 2. HEADER SY MENU AMBONY HAVANANA */
        .header {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            padding: 15px 20px;
            position: sticky;
            top: 0; z-index: 2000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--red);
        }
        .header h1 { margin: 0; font-size: 1.4rem; font-weight: 900; letter-spacing: 2px; }
        .header h1 span { color: var(--red); text-shadow: 0 0 10px var(--red); }

        /* BOUTON MENU */
        .menu-btn {
            background: var(--red);
            border: none; color: white;
            padding: 8px 15px; border-radius: 8px;
            font-weight: 800; font-size: 0.8rem;
            box-shadow: 0 0 10px rgba(255,0,0,0.5);
        }

        /* MENU DROPDOWN */
        .dropdown {
            display: none; position: fixed; top: 65px; right: 15px;
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid var(--red);
            border-radius: 12px; z-index: 3000;
            flex-direction: column; width: 150px;
            overflow: hidden;
            animation: fadeIn 0.3s ease;
        }
        .dropdown button {
            background: none; border: none; color: white;
            padding: 15px; text-align: left; font-weight: bold;
            border-bottom: 1px solid rgba(255,0,0,0.2);
        }
        .dropdown button:active { background: var(--red); }

        /* 3. PRODUCT FEED - INSTAGRAM STYLE */
        .feed { padding: 10px; max-width: 500px; margin: 0 auto; }

        .post {
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 25px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        .img-container { position: relative; width: 100%; aspect-ratio: 1/1; }
        .post-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .post:active .post-img { transform: scale(1.05); }

        .post-info { padding: 15px; }
        .price { 
            font-size: 1.8rem; font-weight: 900; 
            color: #fff; margin: 0;
            text-shadow: 2px 2px 0px var(--red);
        }
        .title { font-size: 1.1rem; font-weight: 700; margin: 5px 0; color: #ddd; }
        .desc { color: #aaa; font-size: 0.85rem; line-height: 1.4; margin-bottom: 15px; }

        /* 4. BUTTONS CALL & WA */
        .actions { display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 14px; border-radius: 12px;
            text-decoration: none; text-align: center;
            font-weight: 900; font-size: 0.85rem;
        }
        .btn-wa { background: #25D366; color: white; }
        .btn-call { background: white; color: black; }

        /* 5. FLOATING RED WA */
        .fab {
            position: fixed; bottom: 20px; right: 20px;
            width: 55px; height: 55px; background: var(--red);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px var(--red); z-index: 1000;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.1)} 100%{transform:scale(1)} }

        @keyframes fadeIn { from {opacity: 0; transform: translateY(-10px);} to {opacity: 1; transform: translateY(0);} }
    </style>
</head>
<body>

<div class="header">
    <h1 onclick="location.reload()">MADA <span>T-F</span></h1>
    <button class="menu-btn" onclick="toggleMenu()">MENU ☰</button>
</div>

<div class="dropdown" id="categoryMenu">
    <button onclick="filterCat('all')">REHETRA</button>
    <button onclick="filterCat('fiara')">FIARA</button>
    <button onclick="filterCat('trano')">TRANO</button>
</div>

<div class="feed" id="mainFeed">
    </div>

<a href="https://wa.me/261340000000" class="fab">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="white"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.767 5.767 0 1.267.405 2.436 1.097 3.39l-.79 2.887 2.955-.774c.78.435 1.666.687 2.61.687 3.181 0 5.767-2.586 5.767-5.767 0-3.181-2.586-5.767-5.767-5.767zm3.39 8.163c-.15.424-.75.787-1.04 1.016-.272.223-.52.223-.742.074-.3-.148-1.258-.464-2.396-1.478-.885-.79-1.48-1.761-1.654-2.059-.174-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/></svg>
</a>

<script>
    let db = [];

    async function start() {
        try {
            const res = await fetch('data.json?v=' + Date.now());
            db = await res.json();
            show(db);
        } catch (e) { console.log("Jereo ny data.json"); }
    }

    function show(data) {
        const feed = document.getElementById('mainFeed');
        feed.innerHTML = data.map(item => `
            <div class="post">
                <div class="img-container">
                    <img src="${item.sary}" class="post-img" loading="lazy">
                </div>
                <div class="post-info">
                    <p class="price">${item.vidy}</p>
                    <div class="title">${item.anarana}</div>
                    <div class="desc">${item.details}</div>
                    <div class="actions">
                        <a href="https://wa.me/${item.tel}" class="btn btn-wa">WHATSAPP</a>
                        <a href="tel:${item.tel}" class="btn btn-call">CALL</a>
                    </div>
                </div>
            </div>
        `).reverse().join('');
    }

    function toggleMenu() {
        const m = document.getElementById('categoryMenu');
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
    }

    function filterCat(c) {
        toggleMenu();
        const f = (c === 'all') ? db : db.filter(i => i.karazana === c);
        show(f);
    }

    window.onclick = function(event) {
        if (!event.target.matches('.menu-btn')) {
            document.getElementById('categoryMenu').style.display = 'none';
        }
    }

    start();
</script>

</body>
</html>
