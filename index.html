<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MADA T-F | Ny Filamatry ny Vita Gasy</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --mg-red: #ed1c24;
            --mg-green: #007e3a;
            --mg-white: #ffffff;
            --primary: #ff6600;
            --bg-dark: #010409;
            --glass: rgba(255, 255, 255, 0.04);
        }

        body { 
            margin: 0; font-family: 'Outfit', sans-serif; 
            background: var(--bg-dark); color: #fff; overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(237, 28, 36, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(0, 126, 58, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* LOGO & SAINA GASY ANIMATION */
        .header {
            padding: 20px; position: sticky; top: 0; z-index: 2000;
            background: rgba(1, 4, 9, 0.9); backdrop-filter: blur(25px);
            border-bottom: 2px solid var(--glass);
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }

        .brand-box { display: flex; align-items: center; gap: 12px; }
        
        /* Animation Saina Gasy */
        .saina-gasy {
            display: flex; width: 35px; height: 22px; border-radius: 4px; overflow: hidden;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
            animation: waveFlag 3s infinite ease-in-out;
        }
        .s-white { width: 35%; background: var(--mg-white); }
        .s-right { width: 65%; display: flex; flex-direction: column; }
        .s-red { height: 50%; background: var(--mg-red); }
        .s-green { height: 50%; background: var(--mg-green); }

        @keyframes waveFlag {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(3deg); }
        }

        .logo-text {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.5rem; font-weight: 700; letter-spacing: 2px;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 102, 0, 0.3);
        }

        /* ICONS ANIMATION (FIARA & TRANO) */
        .floating-icons { display: flex; justify-content: center; gap: 30px; margin-bottom: 15px; }
        .fa-car-side { color: var(--mg-red); animation: drive 4s infinite linear; }
        .fa-house-chimney { color: var(--mg-green); animation: bounce 2s infinite; }

        @keyframes drive {
            0% { transform: translateX(-30px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(30px); opacity: 0; }
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        /* BARRE DE RECHERCHE STYLER */
        .search-box { position: relative; width: 100%; }
        .search-bar {
            width: 100%; padding: 15px 25px; border-radius: 50px;
            border: 1px solid var(--glass); background: rgba(255,255,255,0.05);
            color: #fff; font-size: 1rem; outline: none; transition: 0.4s;
            box-sizing: border-box; text-align: center;
        }
        .search-bar:focus { 
            border-color: var(--mg-green); 
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 20px rgba(0, 126, 58, 0.3);
        }

        /* HERO MARKETING */
        .hero { padding: 30px 20px; text-align: center; }
        .hero h2 { font-size: 0.7rem; letter-spacing: 6px; color: var(--primary); text-transform: uppercase; }
        .hero p { font-size: 2.2rem; font-weight: 900; line-height: 1.1; margin: 5px 0; }

        /* POST CARDS AREA */
        .feed { padding: 0 15px 120px; max-width: 500px; margin: 0 auto; }

        .post {
            background: var(--glass); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 40px; margin-bottom: 45px; overflow: hidden;
            position: relative; animation: revealUp 0.8s ease-out backwards;
        }
        .post:hover { transform: translateY(-10px); border-color: var(--mg-green); }

        .img-container { position: relative; width: 100%; aspect-ratio: 1/1.1; overflow: hidden; }
        .post-img { width: 100%; height: 100%; object-fit: cover; transition: 1.5s; }
        .post:hover .post-img { transform: scale(1.1); }

        /* BADGE PREMIUM */
        .premium-tag {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            padding: 6px 15px; border-radius: 50px; font-size: 0.7rem; font-weight: 800;
            border-left: 3px solid var(--mg-red); z-index: 10;
        }

        .post-info { padding: 30px; text-align: center; }
        .price { 
            font-size: 2.5rem; font-weight: 900; color: #fff; margin: 0;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .title { font-size: 1.4rem; font-weight: 700; margin: 12px 0; }
        .desc { font-size: 0.9rem; color: #aaa; line-height: 1.6; margin-bottom: 25px; }

        /* BUTTONS */
        .btn-group { display: flex; gap: 12px; }
        .btn-call {
            flex: 1; padding: 20px; border-radius: 20px;
            background: #fff; color: #000; text-decoration: none;
            font-weight: 900; font-size: 0.8rem; transition: 0.3s;
        }
        .btn-wa {
            width: 65px; height: 65px; border-radius: 20px;
            background: #25D366; color: #fff; text-decoration: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; transition: 0.3s;
        }
        .btn-call:hover { background: var(--mg-red); color: #fff; }
        .btn-wa:hover { transform: scale(1.1) rotate(10deg); }

        /* NAV BAR BOTTOM */
        .bottom-nav {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
            padding: 12px 35px; border-radius: 40px; border: 1px solid var(--glass);
            display: flex; gap: 35px; z-index: 3000;
        }
        .nav-item { color: #fff; font-size: 1.3rem; opacity: 0.4; cursor: pointer; transition: 0.3s; }
        .nav-item.active { opacity: 1; color: var(--mg-green); transform: scale(1.2); }

        @keyframes revealUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body onload="start()">

<div class="header">
    <div class="header-top">
        <div class="brand-box">
            <div class="saina-gasy">
                <div class="s-white"></div>
                <div class="s-right">
                    <div class="s-red"></div>
                    <div class="s-green"></div>
                </div>
            </div>
            <div class="logo-text" onclick="location.reload()">MADA T-F</div>
        </div>
        <div style="font-size: 0.6rem; color: var(--mg-green); font-weight: 900; letter-spacing: 1px;">
            <i class="fas fa-check-circle"></i> TOPOKO
        </div>
    </div>

    <div class="floating-icons">
        <i class="fas fa-car-side"></i>
        <i class="fas fa-house-chimney"></i>
    </div>

    <div class="search-box">
        <input type="text" class="search-bar" id="searchInput" placeholder="Tadiavo ny tadiavinao malala..." oninput="searchProduct()">
    </div>
</div>

<div class="hero">
    <h2>Safidy matihanina</h2>
    <p>Vita Malagasy,<br>Ho an'ny Malagasy.</p>
</div>

<div class="feed" id="mainFeed"></div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="filterCat('all')"><i class="fas fa-th-large"></i></div>
    <div class="nav-item" onclick="filterCat('fiara')"><i class="fas fa-car"></i></div>
    <div class="nav-item" onclick="filterCat('trano')"><i class="fas fa-building"></i></div>
    <div class="nav-item" onclick="filterCat('tany')"><i class="fas fa-map"></i></div>
</div>

<script src="data.js"></script>

<script>
    function start() {
        if (typeof db !== 'undefined') show(db);
    }

    function show(data) {
        const feed = document.getElementById('mainFeed');
        if(!data || data.length === 0) {
            feed.innerHTML = `<div style="text-align:center; padding:100px; opacity:0.3;">Tsy misy vokatra aloha...</div>`;
            return;
        }
        
        feed.innerHTML = data.map((item, index) => `
            <div class="post" style="animation-delay: ${index * 0.15}s">
                <div class="premium-tag">VITA GASY</div>
                <div class="img-container">
                    <img src="${item.sary}" class="post-img" loading="lazy">
                </div>
                <div class="post-info">
                    <p class="price">${item.vidy}</p>
                    <div class="title">${item.anarana}</div>
                    <div class="desc">${item.details}</div>
                    <div class="btn-group">
                        <a href="tel:${item.tel}" class="btn-call">ANTSOY IZAO</a>
                        <a href="https://wa.me/${item.tel}" class="btn-wa">
                            <i class="fab fa-whatsapp"></i>
                        </a>
                    </div>
                </div>
            </div>
        `).reverse().join('');
    }

    function searchProduct() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        if (typeof db !== 'undefined') {
            const f = db.filter(i => i.anarana.toLowerCase().includes(term) || i.details.toLowerCase().includes(term));
            show(f);
        }
    }

    function filterCat(c) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        event.currentTarget.classList.add('active');
        if (typeof db !== 'undefined') {
            const f = (c === 'all') ? db : db.filter(i => i.karazana === c);
            show(f);
        }
    }
</script>

</body>
</html>
