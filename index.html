<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MADA T-F | Valentine Edition</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --red: #ff0044; /* Rouge Valentine */
            --pink: #ff4d94;
            --dark: #050505;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body { 
            margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; 
            background: #000;
            background: linear-gradient(-45deg, #050505, #4a000e, #000, #2a0005);
            background-size: 400% 400%;
            animation: fireMove 10s ease infinite;
            color: #fff;
            overflow-x: hidden;
        }
        @keyframes fireMove { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        /* HEADER */
        .header {
            background: rgba(10, 0, 5, 0.9);
            backdrop-filter: blur(15px);
            padding: 15px 20px;
            position: sticky;
            top: 0; z-index: 2000;
            display: flex; flex-direction: column; gap: 12px;
            border-bottom: 2px solid var(--red);
            box-shadow: 0 4px 20px rgba(255, 0, 68, 0.3);
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .header h1 { margin: 0; font-size: 1.4rem; font-weight: 900; letter-spacing: 2px; cursor: pointer; }
        .header h1 span { color: var(--red); text-shadow: 0 0 15px var(--red); }

        /* SEARCH BAR STYLER */
        .search-container {
            position: relative; width: 100%;
        }
        .search-bar {
            width: 100%; padding: 12px 45px 12px 20px;
            border-radius: 25px; border: 1px solid var(--red);
            background: rgba(255, 255, 255, 0.05);
            color: white; font-size: 0.9rem; outline: none;
            box-sizing: border-box; transition: 0.3s;
        }
        .search-bar:focus { background: rgba(255, 0, 68, 0.1); box-shadow: 0 0 15px rgba(255, 0, 68, 0.4); }
        .search-icon { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--red); }

        .menu-btn {
            background: linear-gradient(45deg, var(--red), var(--pink));
            border: none; color: white; padding: 8px 15px; border-radius: 20px;
            font-weight: 800; font-size: 0.75rem; box-shadow: 0 0 10px rgba(255,0,68,0.5);
        }

        /* MENU DROPDOWN */
        .dropdown {
            display: none; position: fixed; top: 110px; right: 15px;
            background: rgba(20, 0, 5, 0.98);
            border: 1px solid var(--red); border-radius: 12px; z-index: 3000;
            flex-direction: column; width: 160px; overflow: hidden;
            animation: fadeIn 0.3s ease;
        }
        .dropdown button {
            background: none; border: none; color: white; padding: 15px;
            text-align: left; font-weight: bold; border-bottom: 1px solid rgba(255,0,68,0.2);
        }
        .dropdown button:active { background: var(--red); }

        /* FEED & POSTS */
        .feed { padding: 15px; max-width: 500px; margin: 0 auto; }

        .post {
            background: rgba(30, 0, 10, 0.4);
            margin-bottom: 30px; border-radius: 25px;
            border: 1px solid rgba(255,0,68,0.2);
            overflow: hidden; position: relative;
            animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        /* BADGE VALENTINE */
        .valentine-badge {
            position: absolute; top: 15px; left: 15px;
            background: var(--red); color: white; padding: 5px 12px;
            border-radius: 15px; font-size: 0.7rem; font-weight: bold;
            z-index: 10; box-shadow: 0 0 10px var(--red);
        }

        .img-container { position: relative; width: 100%; aspect-ratio: 1/1; overflow: hidden; }
        .post-img { width: 100%; height: 100%; object-fit: cover; transition: 0.8s; }
        .post:hover .post-img { transform: scale(1.1); }

        .post-info { padding: 20px; background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.8)); }
        .price { 
            font-size: 1.9rem; font-weight: 900; color: #fff; margin: 0;
            text-shadow: 2px 2px 0px var(--red); letter-spacing: -1px;
        }
        .title { font-size: 1.2rem; font-weight: 700; margin: 8px 0; color: #fff; }
        .desc { color: #ccc; font-size: 0.85rem; line-height: 1.4; margin-bottom: 20px; }

        .actions { display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 15px; border-radius: 15px;
            text-decoration: none; text-align: center;
            font-weight: 900; font-size: 0.8rem; transition: 0.3s;
        }
        .btn-wa { background: #25D366; color: white; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); }
        .btn-call { background: white; color: black; }
        .btn:active { transform: scale(0.95); }

        /* FLOATING ACTION BUTTON */
        .fab {
            position: fixed; bottom: 25px; right: 25px;
            width: 60px; height: 60px; background: var(--red);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 25px var(--red); z-index: 1000;
            animation: pulse 2s infinite; color: white;
        }
        @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.1); box-shadow: 0 0 35px var(--red);} 100%{transform:scale(1)} }

        /* HEART DECORATION */
        .heart-bg {
            position: fixed; top: -50px; pointer-events: none;
            color: rgba(255, 0, 68, 0.2); font-size: 20px;
            z-index: 0; animation: fall linear infinite;
        }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        @keyframes fadeIn { from {opacity: 0; transform: translateY(-10px);} to {opacity: 1; transform: translateY(0);} }
    </style>
</head>
<body onload="start()">

<div class="header">
    <div class="header-top">
        <h1 onclick="location.reload()">MADA <span>T-F</span></h1>
        <button class="menu-btn" onclick="toggleMenu()">MENU <i class="fas fa-heart"></i></button>
    </div>
    
    <div class="search-container">
        <input type="text" class="search-bar" id="searchInput" placeholder="Tadiavo eto (ohatra: BMW, Trano...)" oninput="searchProduct()">
        <i class="fas fa-search search-icon"></i>
    </div>
</div>

<div class="dropdown" id="categoryMenu">
    <button onclick="filterCat('all')">REHETRA</button>
    <button onclick="filterCat('fiara')">FIARA</button>
    <button onclick="filterCat('trano')">TRANO</button>
</div>

<div class="feed" id="mainFeed">
    </div>

<a href="https://wa.me/261340000000" class="fab">
    <i class="fab fa-whatsapp" style="font-size: 30px;"></i>
</a>

<script>
    let db = [];

    // Fampidirana Fo kely mandehandeha (Valentine Effect)
    function createHearts() {
        for(let i=0; i<15; i++) {
            let heart = document.createElement('i');
            heart.className = 'fas fa-heart heart-bg';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            heart.style.opacity = Math.random();
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            document.body.appendChild(heart);
        }
    }

    async function start() {
        createHearts();
        try {
            // Mampiasa cache buster mba hahazoana ny data vaovao foana
            const res = await fetch('data.json?v=' + Date.now());
            db = await res.json();
            show(db);
        } catch (e) { 
            console.log("Error loading data.json"); 
            // Demo data raha tsy misy ny data.json
            db = [
                {sary: "https://via.placeholder.com/500", vidy: "25.000.000 Ar", anarana: "Toyota Valentine", details: "Fiara tsara ho an'ny mpivady.", karazana: "fiara", tel: "261340000000"},
                {sary: "https://via.placeholder.com/500", vidy: "150.000.000 Ar", anarana: "Villa Amour", details: "Trano kanto be sady milamina.", karazana: "trano", tel: "261340000000"}
            ];
            show(db);
        }
    }

    function show(data) {
        const feed = document.getElementById('mainFeed');
        if(data.length === 0) {
            feed.innerHTML = `<div style="text-align:center; padding:50px; color:#aaa;">Tsy misy vokatray mifanaraka amin'izany...</div>`;
            return;
        }
        feed.innerHTML = data.map(item => `
            <div class="post">
                <div class="valentine-badge"><i class="fas fa-gift"></i> Valentine Choice</div>
                <div class="img-container">
                    <img src="${item.sary}" class="post-img" loading="lazy">
                </div>
                <div class="post-info">
                    <p class="price">${item.vidy}</p>
                    <div class="title">${item.anarana}</div>
                    <div class="desc">${item.details}</div>
                    <div class="actions">
                        <a href="https://wa.me/${item.tel}" class="btn btn-wa"><i class="fab fa-whatsapp"></i> WHATSAPP</a>
                        <a href="tel:${item.tel}" class="btn btn-call"><i class="fas fa-phone"></i> CALL</a>
                    </div>
                </div>
            </div>
        `).reverse().join('');
    }

    // SEARCH FUNCTION
    function searchProduct() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = db.filter(item => 
            item.anarana.toLowerCase().includes(term) || 
            item.details.toLowerCase().includes(term) ||
            item.vidy.toLowerCase().includes(term)
        );
        show(filtered);
    }

    function toggleMenu() {
        const m = document.getElementById('categoryMenu');
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
    }

    function filterCat(c) {
        toggleMenu();
        const f = (c === 'all') ? db : db.filter(i => i.karazana === c);
        show(f);
    }

    window.onclick = function(event) {
        if (!event.target.matches('.menu-btn')) {
            document.getElementById('categoryMenu').style.display = 'none';
        }
    }
</script>

</body>
</html>
