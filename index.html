<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MADA T-F | Prestige Luxe</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700;800&family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-red: #ff003c;
            --neon-green: #00ff88;
            --gold: #ffcc00;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        
        body { 
            margin: 0; font-family: 'Outfit', sans-serif; 
            background: #000; color: #fff; overflow-x: hidden;
            background: linear-gradient(-45deg, #0d0000, #000, #000d04, #000);
            background-size: 400% 400%;
            animation: flow 15s ease infinite;
        }
        @keyframes flow { 0% {background-position:0% 50%} 50% {background-position:100% 50%} 100% {background-position:0% 50%} }

        /* --- HEADER --- */
        .header-luxe {
            position: sticky; top: 0; z-index: 9999;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px);
            padding: 12px 15px; border-bottom: 1px solid rgba(255, 204, 0, 0.3);
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; }

        /* REFRESH RE-STYLED (Kelikely fa manjelatra) */
        .refresh-ui { text-align: center; }
        .btn-refresh {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(45deg, var(--gold), var(--neon-red));
            border: 2px solid #fff; color: #000; font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px var(--neon-red); cursor: pointer;
            transition: 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .btn-refresh:active { transform: rotate(360deg) scale(0.8); }

        /* LOGO & ICONS */
        .logo-box { text-align: center; }
        .logo-text {
            font-family: 'Syncopate', sans-serif; font-size: 1.3rem; font-weight: 800;
            background: linear-gradient(to right, #fff, var(--gold), var(--neon-green));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: breathe 3s infinite ease-in-out;
        }
        @keyframes breathe { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } }

        .mini-icons { font-size: 0.75rem; color: var(--gold); display: flex; justify-content: center; gap: 10px; margin-top: 4px; opacity: 0.7; }
        .mini-icons i { animation: bounce 2s infinite; }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

        /* SAINA GASY */
        .flag {
            width: 32px; height: 20px; border-radius: 3px; overflow: hidden;
            display: flex; border: 1px solid rgba(255,255,255,0.2);
        }
        .f-w { width: 35%; background: #fff; }
        .f-r { height: 50%; background: var(--neon-red); }
        .f-g { height: 50%; background: var(--neon-green); }

        /* SEARCH BAR */
        .search-wrap { margin-top: 12px; }
        .search-bar {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); color: #fff; text-align: center; font-size: 0.9rem;
        }

        /* --- SOKAJY (KELIKELY & MANINTONA) --- */
        .cat-scroll { display: flex; gap: 8px; padding: 15px; overflow-x: auto; scrollbar-width: none; }
        .cat-btn {
            min-width: 85px; padding: 8px 12px; border-radius: 30px;
            background: var(--glass); border: 1px solid rgba(255,255,255,0.1);
            text-align: center; font-size: 0.75rem; font-weight: 700; color: #aaa; transition: 0.3s;
        }
        .cat-btn.active { background: #fff; color: #000; border-color: #fff; box-shadow: 0 5px 15px rgba(255,255,255,0.2); }

        /* --- PRODUCT CARDS --- */
        .feed { padding: 0 12px 120px; max-width: 500px; margin: 0 auto; }
        .card {
            background: var(--glass); border-radius: 30px; margin-bottom: 35px;
            border: 1px solid rgba(255,255,255,0.08); overflow: hidden;
            backdrop-filter: blur(15px); animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .img-box { width: 100%; aspect-ratio: 1/1; position: relative; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-body { padding: 25px; text-align: center; }
        .price { font-size: 2.2rem; font-weight: 900; color: var(--neon-green); text-shadow: 0 0 15px rgba(0,255,136,0.3); }

        /* --- BUTTONS ACTION --- */
        .btn-flex { display: flex; gap: 10px; margin-top: 20px; }
        .btn-call { flex: 1; padding: 18px; border-radius: 18px; background: #fff; color: #000; font-weight: 900; text-decoration: none; font-size: 1rem; }
        
        .btn-wa { 
            width: 65px; height: 65px; border-radius: 18px; background: #25D366; color: #fff;
            display: flex; align-items: center; justify-content: center; font-size: 2rem;
            box-shadow: 0 10px 20px rgba(37,211,102,0.2); animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

        /* --- NAV BOTTOM --- */
        .nav-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 400px; background: rgba(0,0,0,0.95); border-radius: 30px;
            padding: 15px; display: flex; justify-content: space-around; border: 1px solid rgba(255,204,0,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .nav-i { color: #fff; font-size: 1.4rem; opacity: 0.3; transition: 0.3s; }
        .nav-i.active { opacity: 1; color: var(--gold); transform: translateY(-5px); }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body onload="boot()">

<header class="header-luxe">
    <div class="header-top">
        <div class="refresh-ui" onclick="fullRefresh()">
            <div class="btn-refresh" id="refreshBtn"><i class="fas fa-sync-alt"></i></div>
        </div>
        
        <div class="logo-box">
            <div class="logo-text">MADA T-F</div>
            <div class="mini-icons">
                <i class="fas fa-car"></i>
                <i class="fas fa-home"></i>
                <i class="fas fa-star"></i>
            </div>
        </div>

        <div class="flag">
            <div class="f-w"></div>
            <div style="flex:1; display:flex; flex-direction:column;">
                <div class="f-r"></div><div class="f-g"></div>
            </div>
        </div>
    </div>
    
    <div class="search-wrap">
        <input type="text" class="search-bar" id="find" placeholder="Tadiavo eto..." oninput="liveSearch()">
    </div>
</header>

<div class="cat-scroll">
    <div class="cat-btn active" onclick="filter('all', this)">REHETRA</div>
    <div class="cat-btn" onclick="filter('fiara', this)">FIARA</div>
    <div class="cat-btn" onclick="filter('trano', this)">TRANO</div>
    <div class="cat-btn" onclick="filter('tany', this)">TANY</div>
</div>

<main class="feed" id="mainGrid"></main>

<nav class="nav-bar">
    <div class="nav-i active" onclick="fullRefresh()"><i class="fas fa-home"></i></div>
    <div class="nav-i" onclick="filter('fiara')"><i class="fas fa-car"></i></div>
    <div class="nav-i" onclick="filter('trano')"><i class="fas fa-city"></i></div>
    <div class="nav-i" onclick="filter('tany')"><i class="fas fa-map"></i></div>
</nav>

<script src="data.js"></script>
<script>
    function boot() { if(typeof db !== 'undefined') render(db); }

    function render(data) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = data.map(item => `
            <div class="card">
                <div class="img-box"><img src="${item.sary}" loading="lazy"></div>
                <div class="card-body">
                    <div class="price">${item.vidy}</div>
                    <div style="font-size:1.5rem; font-weight:800; margin:10px 0;">${item.anarana}</div>
                    <p style="color:#aaa; font-size:0.95rem;">${item.details}</p>
                    <div class="btn-flex">
                        <a href="tel:${item.tel}" class="btn-call">ANTSOY IZAO</a>
                        <a href="https://wa.me/${item.tel}" class="btn-wa"><i class="fab fa-whatsapp"></i></a>
                    </div>
                </div>
            </div>
        `).reverse().join('');
    }

    function liveSearch() {
        const val = document.getElementById('find').value.toLowerCase();
        render(db.filter(i => i.anarana.toLowerCase().includes(val) || i.details.toLowerCase().includes(val)));
    }

    function filter(cat, el) {
        if(el) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }
        render(cat === 'all' ? db : db.filter(i => i.karazana === cat));
    }

    function fullRefresh() {
        document.getElementById('find').value = '';
        filter('all', document.querySelector('.cat-btn'));
        const btn = document.getElementById('refreshBtn');
        btn.style.transform = "rotate(360deg)";
        setTimeout(() => { btn.style.transform = "rotate(0deg)"; }, 600);
        window.scrollTo({top: 0, behavior: 'smooth'});
    }
</script>

</body>
</html>
